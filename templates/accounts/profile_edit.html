{% extends "base.html" %}

{% block title %}Edit Profile — FrameRate{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h2 class="text-warning mb-4">Edit Profile</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Avatar URL</label>
                        {{ form.avatar }}
                        <div class="form-text">Paste a URL to your avatar image.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        {{ form.bio }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Favorite Genres</label>
                        {{ form.favorite_genres }}
                        <div class="form-text">Comma-separated, e.g. "Sci-Fi, Drama, Thriller"</div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">Save Changes</button>
                        <a href="{% url 'profile' request.user.username %}" class="btn btn-outline-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
