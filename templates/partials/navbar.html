<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand fw-bold text-warning" href="/">
            <span class="material-icons align-middle">movie</span>
            FrameRate
        </a>

        <!-- Search bar with live dropdown -->
        <form class="d-flex mx-auto position-relative" style="width: 400px;" action="/search/" method="get" id="search-form">
            <input class="form-control form-control-sm me-2" type="search"
                   name="q" placeholder="Search movies..." aria-label="Search"
                   id="search-input" autocomplete="off">
            <button class="btn btn-outline-warning btn-sm" type="submit">Search</button>

            <!-- Live dropdown -->
            <div id="search-dropdown"
                 class="position-absolute bg-dark border border-secondary rounded shadow"
                 style="top: 100%; left: 0; right: 0; max-height: 400px; overflow-y: auto; z-index: 1000; display: none;">
            </div>
        </form>

        <!-- Auth buttons -->
        <div class="d-flex">
            <a href="{% url 'circle_list' %}" class="btn btn-sm btn-outline-warning me-2">
                <span class="material-icons align-middle" style="font-size: 18px;">groups</span>
                Circles
            </a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile_redirect' %}" class="btn btn-sm btn-outline-light me-2">
                    <span class="material-icons align-middle" style="font-size: 18px;">person</span>
                    {{ user.username }}
                </a>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light me-2">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-sm btn-warning">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
